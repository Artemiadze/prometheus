[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "prometheus-runtime"
version = "0.1.0"
description = "Local RAG runtime for the Prometheus Obsidian plugin"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1",
    "pydantic>=2.10,<3",
    "pydantic-settings>=2.7,<3",
    "typer>=0.15,<1",
    "uvicorn[standard]>=0.34,<1",
]

[project.scripts]
prometheus-runtime = "bootstrap.cli:main"

[dependency-groups]
dev = [
    "black>=25.1,<26",
    "httpx>=0.28,<1",
    "import-linter>=2.2,<3",
    "mypy>=1.14,<2",
    "pytest>=8.3,<9",
    "pytest-cov>=6,<7",
    "ruff>=0.9,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/domain", "src/application", "src/adapters", "src/bootstrap"]

[tool.uv]
default-groups = ["dev"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.black]
target-version = ["py312"]
line-length = 100

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers --strict-config"
pythonpath = ["tests"]

[tool.importlinter]
root_packages = ["domain", "application", "adapters", "bootstrap"]
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Clean Architecture layers"
type = "layers"
layers = [
    "bootstrap",
    "adapters",
    "application",
    "domain",
]

[[tool.importlinter.contracts]]
name = "Domain has no framework dependencies"
type = "forbidden"
source_modules = ["domain"]
forbidden_modules = [
    "fastapi",
    "fastembed",
    "httpx",
    "pydantic",
    "pydantic_settings",
    "qdrant_client",
    "uvicorn",
]

[[tool.importlinter.contracts]]
name = "Application has no adapter dependencies"
type = "forbidden"
source_modules = ["application"]
forbidden_modules = [
    "fastapi",
    "fastembed",
    "httpx",
    "pydantic_settings",
    "qdrant_client",
    "uvicorn",
]
