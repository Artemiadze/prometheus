name: CI

on:
  push:
    paths:
      - "apps/prometheus-runtime/**"
      - "apps/prometheus-plugin/**"
      - "packaging/**"
      - "evals/**"
      - "Makefile"
      - "manifest.json"
      - "versions.json"
      - ".github/workflows/ci.yml"
      - ".github/workflows/release-runtime.yml"
  pull_request:
    paths:
      - "apps/prometheus-runtime/**"
      - "apps/prometheus-plugin/**"
      - "evals/**"
      - "packaging/**"
      - "Makefile"
      - "manifest.json"
      - "versions.json"
      - ".github/workflows/ci.yml"
      - ".github/workflows/release-runtime.yml"

permissions:
  contents: read

jobs:
  runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v10
        with:
          # Prefer Astral mirror; avoid flaky GitHub Releases 504s on setup-uv@v6.
          version: "0.13.7"
          enable-cache: true
          github-token: ${{ github.token }}
          cache-dependency-glob: "apps/prometheus-runtime/uv.lock"
      - name: Install Python and dependencies
        run: uv sync --frozen --project apps/prometheus-runtime
      - name: Lint
        run: make runtime-lint
      - name: Typecheck
        run: make runtime-typecheck
      - name: Architecture contracts
        run: make runtime-arch
      - name: Test
        run: make runtime-test
      - name: Verify OpenAPI contract
        run: make runtime-openapi-check

  evals:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v10
        with:
          version: "0.13.7"
          enable-cache: true
          github-token: ${{ github.token }}
          cache-dependency-glob: "evals/uv.lock"
      - name: Install Python and dependencies
        run: uv sync --frozen --project evals
      - name: Evals check
        run: make evals-check

  plugin:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/prometheus-plugin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/prometheus-plugin/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Test
        run: npm run test
      - name: Build
        run: npm run build
      - name: Check production bundle
        run: node scripts/check-prod-bundle.mjs

  # Official Obsidian community directory checks (eslint-plugin-obsidianmd +
  # stylelint scanner). Catches submission Errors on PRs before tagging a release.
  # The action only inspects GITHUB_WORKSPACE root, so we stage a standard plugin
  # layout from this monorepo and point the action at that directory.
  obsidian:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/prometheus-plugin/package-lock.json

      - name: Stage plugin workspace for Obsidian workflows
        id: stage
        run: |
          set -euo pipefail
          STAGE="${GITHUB_WORKSPACE}/.ci/obsidian-plugin"
          mkdir -p "$STAGE"
          cp manifest.json versions.json LICENSE README.md "$STAGE/"
          cp apps/prometheus-plugin/package.json \
            apps/prometheus-plugin/package-lock.json \
            apps/prometheus-plugin/tsconfig.json \
            apps/prometheus-plugin/esbuild.config.mjs \
            apps/prometheus-plugin/styles.css \
            "$STAGE/"
          cp -a apps/prometheus-plugin/src "$STAGE/src"
          cp -a apps/prometheus-plugin/tests "$STAGE/tests"
          echo "path=${STAGE}" >> "$GITHUB_OUTPUT"

      - name: Obsidian community scanner
        uses: obsidianmd/obsidian-workflows@v1
        env:
          GITHUB_WORKSPACE: ${{ steps.stage.outputs.path }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          type: plugin
          mode: pr
          scanner-lint: true
          strict: true
          node-version: "20"
